{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TestBrain - 测试用例管理平台{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-theme@0.1.0-beta.10/dist/select2-bootstrap.min.css" rel="stylesheet" />
    <style>
        :root {
            --atp-primary: #0284C7;
            --atp-brand-50: #F0F9FF;
            --atp-brand-100: #E0F2FE;
            --atp-brand-200: #BAE6FD;
            --atp-brand-600: #0369A1;
            --atp-text: #0F172A;
            --atp-text-secondary: #475569;
            --atp-border: #E2E8F0;
        }

        body {
            background: #fff;
            color: var(--atp-text);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* 浅色次级导航，避免与 ATP 深色侧栏视觉冲突 */
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 0;
            box-shadow: inset -1px 0 0 var(--atp-border);
            background-color: var(--atp-brand-50);
            width: 200px;
        }

        .brand-title {
            padding: 0.8rem 1rem;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--atp-brand-600);
            margin: 0;
            line-height: 1.5;
            border-bottom: 1px solid var(--atp-brand-100);
            text-align: left;
            display: block;
            width: 100%;
            letter-spacing: -0.01em;
            background: #fff;
        }

        .sidebar .nav-link {
            font-weight: 500;
            color: var(--atp-text-secondary);
            padding: 0.8rem 1rem;
            text-align: left;
            border-left: 3px solid transparent;
            transition: color .2s, background .2s, border-color .2s;
        }

        .sidebar .nav-link:hover {
            color: var(--atp-primary);
            background-color: var(--atp-brand-100);
        }

        .sidebar .nav-link.active {
            color: var(--atp-primary);
            background-color: #fff;
            border-left-color: var(--atp-primary);
            font-weight: 600;
        }

        .sidebar .nav-link i {
            margin-right: 8px;
            width: 20px;
            text-align: center;
            color: inherit;
        }

        .main-content {
            margin-left: 200px;
            padding: 20px 30px;
            min-height: 100vh;
            background: #fff;
        }

        .nav-menu { padding: 0; margin: 0; }
        .nav-menu .nav { padding: 0; margin: 0; }
        .nav-menu .nav-item { width: 100%; }

        .btn-primary {
            background-color: var(--atp-primary) !important;
            border-color: var(--atp-primary) !important;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--atp-brand-600) !important;
            border-color: var(--atp-brand-600) !important;
        }
        .text-primary { color: var(--atp-primary) !important; }
        a { color: var(--atp-primary); }
        a:hover { color: var(--atp-brand-600); }
        .card {
            border: 1px solid var(--atp-border);
            border-radius: 10px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 16px rgba(2, 132, 199, 0.06);
        }
        .card-header {
            background: linear-gradient(180deg, var(--atp-brand-50) 0%, #fff 100%);
            border-bottom: 1px solid var(--atp-brand-100);
            font-weight: 600;
        }
        .form-control:focus {
            border-color: #38BDF8;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .spinner-border.text-primary {
            color: var(--atp-primary) !important;
        }
        .bootstrap-select .dropdown-menu li.selected a,
        .bootstrap-select .dropdown-menu li a:hover {
            background: rgba(2, 132, 199, 0.1) !important;
            color: var(--atp-primary) !important;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 左侧导航栏 -->
    <nav class="sidebar">
        <!-- 品牌标题 -->
        <div class="brand-title">
            TestBrain
        </div>
        
        <!-- 导航菜单 -->
        <div class="nav-menu">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="fas fa-home"></i>
                        首页
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/generate/' in request.path %}active{% endif %}" href="/test_case_generator/">
                        <i class="fas fa-plus-circle"></i>
                        测试用例生成
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/test_case_reviewer/' in request.path %}active{% endif %}" href="/test_case_reviewer/">
                        <i class="fas fa-check-circle"></i>
                        测试用例评审
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/upload/' in request.path %}active{% endif %}" href="/upload/">
                        <i class="fas fa-upload"></i>
                        项目文档上传到知识库
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/prd_analyzer/' in request.path %}active{% endif %}" href="/prd_analyzer/">
                        <i class="fas fa-upload"></i>
                        测试点&测试场景分析
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/iface_case_generator/' in request.path %}active{% endif %}" href="/iface_case_generator/">
                        <i class="fas fa-code"></i>
                        接口case生成
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/java_code_analyzer/' in request.path %}active{% endif %}" href="/java_code_analyzer/">
                        <i class="fas fa-code-branch"></i>
                        Java源码分析
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/knowledge/' in request.path %}active{% endif %}" href="/knowledge/">
                        <i class="fas fa-book"></i>
                        知识库管理(暂时不支持)
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/extra/jquery.min.js' %}"></script>
    <!-- <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.bundle.min.js"></script> -->
    <!-- <script src="https://cdn.bootcdn.net/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script> -->
     <!-- 修改为使用本地文件 -->
    <script src="{% static 'js/extra/all.min.js' %}"></script>
    <script src="{% static 'js/extra/bootstrap.bundle.min.js' %}" data-no-maps></script>
    <!-- <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap-select/1.13.14/js/bootstrap-select.min.js"></script> -->
    <script src="{% static 'js/extra/bootstrap-select.min.js' %}" data-no-maps></script>
    <script src="{% static 'js/extra/select2.min.js' %}" data-no-maps></script>
    <script>
        $(document).ready(function() {
            $('.selectpicker').selectpicker({
                style: 'btn-default',
                noneSelectedText: '请选择',
                liveSearch: true,
                showTick: true,
                actionsBox: true
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
