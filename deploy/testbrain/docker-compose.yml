# 国内网络：默认走 DaoCloud 镜像代理，避免直连 docker.io 超时
# podman-compose：depends_on 仅用服务名列表（不用 service_healthy，易触发 tb-etcd 依赖解析错误）
name: atp-testbrain

services:
  etcd:
    image: quay.m.daocloud.io/coreos/etcd:v3.5.16
    container_name: tb-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - tb_etcd:/etcd

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: tb-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - tb_minio:/minio_data

  milvus:
    image: docker.m.daocloud.io/milvusdb/milvus:v2.4.15
    container_name: tb-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - tb_milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  testbrain-mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: tb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-testbrain123}
      MYSQL_DATABASE: ${MYSQL_DB:-test_brain_db}
      MYSQL_USER: ${MYSQL_USER:-testbrain}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testbrain123}
    volumes:
      - tb_mysql:/var/lib/mysql
    ports:
      - "3307:3306"

  testbrain:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: tb-app
    env_file:
      - .env
    environment:
      MYSQL_HOST: testbrain-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-testbrain}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testbrain123}
      MYSQL_DB: ${MYSQL_DB:-test_brain_db}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_DB_NAME: default
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-vv_knowledge_collection}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-aliyun}
      DJANGO_SETTINGS_MODULE: config.settings_docker
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-qwen}
    ports:
      - "8001:8000"
    depends_on:
      - testbrain-mysql
      - milvus
    volumes:
      - tb_uploads:/app/uploads

volumes:
  tb_etcd:
  tb_minio:
  tb_milvus:
  tb_mysql:
  tb_uploads:
