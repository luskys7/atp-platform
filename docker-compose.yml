version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: atp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: atp_root_pass
      MYSQL_DATABASE: atp_platform
      MYSQL_USER: atp_user
      MYSQL_PASSWORD: atp_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - atp-net

  redis:
    image: redis:7-alpine
    container_name: atp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - atp-net

  minio:
    image: minio/minio:latest
    container_name: atp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: atp_minio
      MINIO_ROOT_PASSWORD: atp_minio_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - atp-net

  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: atp-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: atp_user
      MYSQL_PASSWORD: atp_pass
      REDIS_HOST: redis
      MINIO_HOST: minio
      MINIO_ACCESS_KEY: atp_minio
      MINIO_SECRET_KEY: atp_minio_pass
      JWT_SECRET: atp-jwt-secret-change-in-production
      EXECUTOR_URL: http://executor:9002
    depends_on:
      - mysql
      - redis
      - minio
      - executor
    networks:
      - atp-net

  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    container_name: atp-executor
    restart: unless-stopped
    ports:
      - "9002:9002"
    networks:
      - atp-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - atp-net

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  atp-net:
    driver: bridge
